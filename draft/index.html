<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://lolban.com/">
  <noscript><meta http-equiv="refresh" content="0;url=https://lolban.com/"></noscript>
  <title>밴픽 보드 주소가 변경되었습니다</title>
  <script>
    (async function () {
      const target = 'https://lolban.com/' + location.search;
      if (location.hash) {
        location.replace(target + location.hash);
        return;
      }
      const data = {};
      ['sentrix-draft.v1', 'sentrix-draft.saved.v1', 'sentrix-draft.space.v1'].forEach((key) => {
        try {
          const value = localStorage.getItem(key);
          if (value) data[key] = value;
        } catch (error) { /* 저장소 접근이 차단된 브라우저에서는 주소만 이동한다. */ }
      });
      if (!Object.keys(data).length) {
        location.replace(target);
        return;
      }
      const raw = new TextEncoder().encode(JSON.stringify({ v: 1, data }));
      let bytes = raw;
      let prefix = 'j';
      if (typeof CompressionStream === 'function') {
        try {
          bytes = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
          prefix = 'z';
        } catch (error) { /* 압축을 지원하지 않으면 기존 JSON 이전 형식을 사용한다. */ }
      }
      let encoded = '';
      bytes.forEach((byte) => { encoded += String.fromCharCode(byte); });
      const token = prefix + btoa(encoded).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      location.replace(target + '#move=' + token);
    })();
  </script>
</head>
<body>
  <p>밴픽 보드가 <a href="https://lolban.com/">lolban.com</a>으로 이동했습니다.</p>
</body>
</html>
